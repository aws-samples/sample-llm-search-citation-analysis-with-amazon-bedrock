# Local CodeQL run (scripts/codeql-local.sh): what GitHub's code scanning sees,
# minus generated, vendored and local-only files (built layers, bundled deps,
# synthesized templates, build output, test reports, caches).
name: citation-analysis-local
paths-ignore:
  - '**/node_modules/**'
  - '**/.deps/**'
  - 'lambda/layer/python/**'
  - 'lambda/crawler-layer/python/**'
  - 'cdk.out/**'
  - '**/cdk.out*/**'
  - 'web/dist/**'
  - '**/coverage/**'
  - '.venv/**'
  - '.kiro/**'
  - '.hypothesis/**'
  - 'mutants/**'
  - '.codeql-local/**'
