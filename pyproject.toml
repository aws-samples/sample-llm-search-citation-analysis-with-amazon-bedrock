[tool.ruff]
# Python 3.12 is the Lambda runtime target for this project.
target-version = "py312"
line-length = 120
src = ["lambda"]

extend-exclude = [
    "node_modules",
    ".hypothesis",
    ".pytest_cache",
    ".ruff_cache",
    "cdk.out",
    "lambda/*/.deps",
    "lambda/**/__pycache__",
    "lambda/layer/python",        # layer build artifacts
    "lambda/crawler-layer/python",
]

[tool.pytest.ini_options]
# Without this, bare `pytest` from the repo root walks into the built Lambda
# layers and tries to collect ~20 vendored third-party test modules —
# `greenlet/tests/test_cpp.py` compiles C++, `certifi/tests` imports a package
# that isn't installed — and the run dies with collection errors before any
# first-party test executes. The exclusions mirror `[tool.ruff].extend-exclude`
# above; keep the two lists in step when a new layer is added.
testpaths = ["lambda"]
norecursedirs = [
    "node_modules",
    "cdk.out",
    "lambda/*/.deps",
    "lambda/layer/python",        # layer build artifacts
    "lambda/crawler-layer/python",
    "*.egg",
    ".*",
]

[tool.ruff.lint]
# Curated rule set:
#   F   — pyflakes (unused imports F401, unused local vars F841, undefined names)
#   E   — pycodestyle errors (syntax-adjacent)
#   W   — pycodestyle warnings
#   I   — isort (import ordering)
#   B   — flake8-bugbear (likely bugs)
#   ARG — flake8-unused-arguments (dead parameters)
#   UP  — pyupgrade (Python 3.12 modernizations)
#   SIM — flake8-simplify (readability)
#   RUF — ruff-specific lints
#   C90 — mccabe cyclomatic complexity (C901)
#   PLR0911/0912/0915 — pylint: too many returns / branches / statements
#   RET504 — a value assigned only to be returned on the next line
#   ERA001 — commented-out code (delete it; git remembers)
#   S   — flake8-bandit security checks (see per-file-ignores for the two
#         documented false-positive classes)
#   BLE001 — blind `except Exception`; satisfied by re-raising or by logging
#         with logger.exception(), which keeps the traceback
#   TRY002/300/301/400 — tryceratops: no vanilla `raise Exception`, no `return`
#         inside `try` (use else), no `raise` inside `try`, `logger.exception`
#         not `logger.error` inside `except`. TRY003 (long messages outside the
#         exception class) is deliberately not selected: this codebase raises
#         built-in exception types with dynamic messages, and TRY003 would only
#         be satisfied by wrapping every message in a custom class.
#   T20 — no print(); Lambda code logs through `logging`
#   PT  — flake8-pytest-style
#
# The ceilings below are hard stops. Cyclomatic complexity is capped at 12
# (both languages: eslint.config.mjs caps TypeScript at the same value); the
# pylint counts were set in 2.5.1 to half of the worst function then in the
# tree (23 returns / 33 branches / 107 statements) and every function above
# them was split. Lower them as hotspots are broken up; never raise them, and
# never `# noqa` past them — split the function.
select = [
    "F", "E", "W", "I", "B", "ARG", "UP", "SIM", "RUF",
    "C90", "PLR0911", "PLR0912", "PLR0915", "RET504", "ERA001",
    "S", "BLE001", "TRY002", "TRY300", "TRY301", "TRY400", "T20", "PT",
]

ignore = [
    "E501",    # line-too-long — handled by formatter, not this project's priority
    "ARG002",  # unused method arg — Lambda `context` is often unused but required by signature
    "B008",    # function call in default arg — used for `Optional[...]` helpers
    "SIM108",  # ternary over if/else — readability preference
    "UP007",   # `Optional[X]` vs `X | None` — Lambda layer code sticks with Optional for boto3 compat
]

[tool.ruff.lint.per-file-ignores]
# Handler entry points: `event` and `context` are required by AWS but often unused by routers.
"lambda/**/handler.py"      = ["ARG001"]
"lambda/api/**"             = ["ARG001"]
# Tests: allow magic values, imperative fixtures, loose typing. Mock lambdas
# must match the mocked signature even when arguments go unused (ARG005), and
# the sys.path shim before importing hyphenated Lambda modules forces imports
# below module-level statements (E402). `assert` IS the test mechanism (S101)
# and test fixtures legitimately hold literal "passwords" and predictable
# randomness, so the bandit family does not apply to tests or test support.
"lambda/**/test_*.py"       = ["ARG001", "ARG002", "ARG005", "B017", "E402", "RUF012", "SIM", "S"]
"lambda/conftest.py"        = ["S"]
"lambda/testing/**"         = ["S101"]
# Layer smoke test imports symbols specifically to prove they're packaged, and
# reports through print() because it runs before logging is configured.
"lambda/layer/test-layer.py" = ["F401", "T201"]
# Repo tooling scripts talk to a terminal; print() is their output channel.
"scripts/*.py"              = ["T201"]
# Shared __init__.py re-exports: imports are used at module boundary, ruff can't see cross-module.
"lambda/shared/__init__.py" = ["F401"]
# Bandit false positives, each verified:
#   S311 — random jitter for retry backoff / provider ordering; not cryptographic.
#   S105 — `SIGNALS_SECRET_NAME` is the *name* of a Secrets Manager secret.
#   S608 — the "SQL" is an LLM prompt that happens to contain the word SELECT.
#   S104 — 0.0.0.0 appears in the SSRF *blocklist*, not as a bind address.
"lambda/shared/ai_clients.py"     = ["S311"]
"lambda/shared/models.py"         = ["S311"]
"lambda/shared/research_agent.py" = ["S105", "S608"]
"lambda/shared/url_validator.py"  = ["S104"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "api_clients", "search_clients", "brand_extractor"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-returns = 11
max-branches = 16
max-statements = 53

# ---------------------------------------------------------------------------
# Vulture config — dead-code finder. Complements ruff.
#
# Single source of truth for the shared settings; `scripts/lint-python.sh`
# layers the two gate modes on top (CLI flags replace, not extend, the values
# here — so the script re-states `exclude` when it narrows the scan):
#   --dead-code        production scan: this exclude list plus test_*.py,
#                      conftest.py and testing/, so a test reference cannot
#                      keep a production symbol alive
#   --dead-code-tests  whole tree, catches dead test helpers
# Run either directly, or `vulture lambda/` for the whole-tree view.
# ---------------------------------------------------------------------------
[tool.vulture]
paths = ["lambda"]
# Vulture's `exclude` matches against file paths with substring semantics; glob
# wildcards are not interpreted. Keep the patterns simple.
exclude = [
    "*/layer/python/*",
    "*/crawler-layer/python/*",
    "*/.deps/*",
    "*/__pycache__/*",
]
# Names that look dead but are entry points, decorator targets, or framework hooks.
ignore_names = [
    "handler",              # Lambda entry point invoked by AWS
    "lambda_handler",
    "default",              # JSONEncoder.default override
    "_api_handler",         # decorated with @route_handler; name is stable
    "_route_handler",
    "pytestmark",           # pytest reads this module attribute, nothing imports it
]
ignore_decorators = [
    "@api_handler",
    "@route_handler",
    "@validate",
    "@parse_json_body",
    "@paginate",
    "@cors_preflight",
    "@require_group",
    "@retry_with_backoff",
    "@pytest.fixture",
    "@pytest.mark.parametrize",
]
# 60% is the tier vulture assigns every unused function, class, method,
# attribute and variable; only unused imports (90%) and unreachable code (100%)
# score higher. A higher floor therefore cannot report a dead function at all.
min_confidence = 60
sort_by_size = true


# ---------------------------------------------------------------------------
# Pyright config — static type checker. ruff does not check types.
# Run: pyright   (settings below; `scripts/lint-python.sh --types`)
#
# Covers the whole Lambda tree and the repo tooling in `standard` mode. Never
# add a directory to `exclude` to silence it, and never suppress a finding
# inline — fix the type or the annotation. (`strict` mode is not a realistic
# next step for this codebase: measured at 2,754 findings on lambda/shared
# alone, almost all `reportUnknown*` on the dict[str, Any] rows.)
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
include = ["lambda", "scripts"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.deps",
    "lambda/layer/python",
    "lambda/crawler-layer/python",
]
# Where imports resolve from: first-party modules under lambda/, then the built
# shared layer for the runtime libraries the handlers import. The crawler layer
# is deliberately absent: it bundles an untyped boto3 for AgentCore, which would
# shadow boto3-stubs; its client libraries (playwright, bedrock-agentcore) are
# installed into the dev venv at the layer's pins by lambda/requirements-dev.txt.
extraPaths = ["lambda", "lambda/layer/python"]
venvPath = "."
venv = ".venv"
